name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: face_recognition
          POSTGRES_USER: face_admin
          POSTGRES_PASSWORD: face_secure_password_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U face_admin -d face_recognition"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: face_recognition
      POSTGRES_USER: face_admin
      POSTGRES_PASSWORD: face_secure_password_2026
      DATABASE_URL: postgresql://face_admin:face_secure_password_2026@localhost:5432/face_recognition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q -m "not integration"
      - name: Run PostgreSQL/pgvector integration tests
        run: pytest -q -m integration
