version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nguyencuu_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: face_recognition
      POSTGRES_USER: face_admin
      POSTGRES_PASSWORD: face_secure_password_2026
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U face_admin -d face_recognition"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
